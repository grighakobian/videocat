# Reverse-DNS of the domain we actually own. Changing this after a release would make
# every OS treat the new build as a different app — installed side by side on Windows,
# a separate identity on macOS — so it is set now, before the first one goes out.
appId: io.videocat.app
productName: VideoCat
# Where the app looks for updates, and where `electron-builder --publish` sends builds.
# electron-updater reads the latest-*.yml that a publish-configured build writes next to
# the installers, so this block is what makes "Check for updates" able to find anything.
publish:
  provider: github
  owner: grighakobian
  repo: videocat
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/.vscode/*'
  - '!**/{.eslintrc,.prettierrc,tsconfig*.json,electron.vite.config.ts}'
# ffmpeg-static ships a real executable; it cannot run from inside the asar archive.
asarUnpack:
  - node_modules/ffmpeg-static/**
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  darkModeSupport: false
  # yt-dlp and ffmpeg are spawned as child processes and JIT is needed by Electron itself.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: VideoCat uses Apple Events to reveal downloaded files in Finder.
win:
  # Full-bleed variant: Windows draws no margin of its own (see scripts/make-icons.mjs).
  icon: build/icon-win.png
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target: [AppImage]
  category: Utility
